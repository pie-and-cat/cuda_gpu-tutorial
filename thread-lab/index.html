<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="src/theme-init.js"></script>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div class="splash" id="splash" role="dialog" aria-modal="true" aria-labelledby="splash-title" hidden></div>
<header class="topbar">
  <div class="brand">
    <button type="button" class="wordmark" id="btn-home" title="Open the start screen">Thread <span>Lab</span></button>
  </div>
  <nav class="levels" id="levels" aria-label="Tracks and levels"></nav>
  <div class="header-tools">
  <button class="btn theme-toggle" type="button" id="btn-theme" aria-pressed="false" title="Switch between light and dark colors">
    <svg class="moon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M15.5 12.6A6.5 6.5 0 0 1 7.4 4.5a6.5 6.5 0 1 0 8.1 8.1z" fill="currentColor"/></svg>
    <svg class="sun" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="currentColor"/><path d="M10 1.8v2.2M10 16v2.2M1.8 10H4M16 10h2.2M4.2 4.2l1.6 1.6M14.2 14.2l1.6 1.6M4.2 15.8l1.6-1.6M14.2 5.8l1.6-1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span class="label">Dark mode</span>
  </button>
  <button class="btn sound-toggle" type="button" id="btn-sound" aria-pressed="true" title="Play a sound when a level is solved">
    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 7.5h3l4.5-3.5v12L6 12.5H3z" fill="currentColor"/><path class="spk-on" d="M13.2 7.3a3.8 3.8 0 0 1 0 5.4M15.6 4.9a7.2 7.2 0 0 1 0 10.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path class="spk-off" d="M13.5 7.5l4.5 5M18 7.5l-4.5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span class="label">Sound on</span>
  </button>
  </div>
</header>
<main class="lab">
  <section class="panel mission" id="mission"></section>
  <section class="panel palette" id="palette" aria-label="Blocks"></section>
  <section class="panel kernel" id="kernel" aria-label="Your kernel"></section>
  <section class="panel stage" id="stage" aria-label="The GPU">
    <div class="stage-head">
      <h2>The GPU</h2>
      <div class="controls">
        <div class="controls-main">
          <button class="btn primary" type="button" id="btn-run">Run on GPU</button>
          <button class="btn" type="button" id="btn-step">Step</button>
          <button class="btn" type="button" id="btn-cpu" hidden>Compare with CPU</button>
        </div>
        <div class="controls-side">
          <button class="btn quiet" type="button" id="btn-reset" hidden>Reset simulation</button>
          <label class="speed-control" for="speed">Speed
            <select id="speed"><option value="slow">Slow</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select>
          </label>
        </div>
      </div>
    </div>
    <div class="launch" id="launch"></div>
    <div class="ticker" id="ticker" aria-live="polite"></div>
    <div class="viz" id="viz"></div>
    <div class="verdict" id="verdict" role="status"></div>
    <div class="inspector" id="inspector"></div>
  </section>
</main>
<footer class="credits" id="credits"></footer>
<script src="src/engine.js"></script>
<script src="src/physics.js"></script>
<script src="src/data/professor.js"></script>
<script src="src/data/faces.js"></script>
<script src="src/data/celebrate.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
